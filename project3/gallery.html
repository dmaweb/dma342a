<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scoops and Smiles Ice Cream Parlour</title>
		<!-- Google fonts code-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600&family=Outfit:wght@400&display=swap"
			rel="stylesheet"
		/>
		<!-- End Google fonts code-->

		<link rel="stylesheet" href="style.css" />
	</head>
	<body class="news">
		<header>
			<a href="index.html"
				><img src="img/logo.svg" class="logo" alt="Scoops and Smiles Ice Cream Parlour logo"
			/></a>
			<nav>
				<a href="about.html">About</a>
				<a href="gallery.html" class="current">Gallery</a>
				<a href="news.html">News</a>
				<a href="contact.html">Contact</a>
				<a href="shop.html">Shop</a>
			</nav>
		</header>

		<main>
			<section>
				<h1>Gallery</h1>
				<div class="cards">
					<div class="card">
						<img src="img/gall1.jpg" alt="Banana Split" />
					</div>
					<div class="card">
						<img src="img/gall2.jpg" alt="Mint Chip Ice Cream Cone" />
					</div>
					<div class="card">
						<img src="img/gall3.jpg" alt="People enjoying ice cream" />
					</div>
					<div class="card">
						<img src="img/gall4.jpg" alt="Ice cream truck" />
					</div>
					<div class="card">
						<img src="img/gall5.jpg" alt="Ice cream server" />
					</div>
					<div class="card">
						<img src="img/gall6.jpg" alt="Friendly ice cream employee" />
					</div>
				</div>
			</section>
		</main>

		<div class="lightbox"></div>
		<footer>
			<p>©2026 Scoops and Smiles Inc. All rights reserved.</p>
		</footer>
		<script>
			const lightbox = document.querySelector('.lightbox');
			const galleryImages = document.querySelectorAll('.cards .card img');

			galleryImages.forEach(function (image) {
				image.addEventListener('click', function () {
					lightbox.replaceChildren(image.cloneNode());
					lightbox.style.display = 'flex';
				});
			});

			function closeLightbox() {
				lightbox.style.display = 'none';
			}

			lightbox.addEventListener('click', closeLightbox);
			document.addEventListener('keydown', function (event) {
				if (event.key === 'Escape') {
					closeLightbox();
				}
			});
		</script>
	</body>
</html>
